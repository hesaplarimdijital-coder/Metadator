name: Metadator DeX APK

# Builds the APK of the metadator-dex branch on every push and publishes it as a release asset, so
# it can be downloaded straight to a phone. This branch lives in a repository that is not a fork of
# Metadator; the upstream CI workflow only runs on master, v2 and pull requests, so it never fires
# here.
#
# The APK is then used on an emulator (see .github/smoke), and what happened there is published
# next to it. A push that only changes how the APK is tried says so in its message, with
# [smoke-only], and the APK already published is tried again without being built again.
on:
  push:
    branches: [metadator-dex]
  workflow_dispatch:

permissions:
  contents: write

# A new push replaces the build still running: only the latest APK matters.
concurrency:
  group: metadator-dex-apk
  cancel-in-progress: true

jobs:
  apk:
    name: APK
    if: ${{ !contains(github.event.head_commit.message, '[smoke-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: 'false'

      # Each step keeps what Gradle said, for the report below.
      - name: Unit tests of the plain Kotlin modules
        id: tests
        run: |
          set -o pipefail
          ./gradlew \
            :core:common:test :core:domain:test :tags:api:test \
            :lookup:api:test :lookup:musicbrainz:test :lookup:deezer:test :lookup:itunes:test \
            :lyrics:api:test :lyrics:lrclib:test \
            --continue 2>&1 | tee tests.log

      # A release build, as the app is meant to run: a debug one is slower, and brings LeakCanary
      # along. Signed with the key kept in this branch, so that each build installs over the one
      # before it, and under an id of its own (-Pmetadator.fork), so that it installs next to the
      # app from its store.
      - name: Build the APK
        id: build
        if: ${{ !cancelled() }}
        env:
          SIGNING_KEY_STORE_PATH: ${{ github.workspace }}/.github/metadator-dex-debug.keystore
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
          SIGNING_KEY_PASSWORD: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleFossRelease -Pmetadator.fork=dex 2>&1 | tee build.log

      - name: Check that the APK is signed
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          apk=$(ls app/build/outputs/apk/foss/release/*.apk | head -n 1)
          case "$apk" in
            *-unsigned.apk) echo "::error::Unsigned APK: $apk"; exit 1 ;;
          esac
          cp "$apk" metadator-dex.apk
          ls -l metadator-dex.apk

      - name: Upload the APK
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadator-dex
          path: metadator-dex.apk
          if-no-files-found: error
          retention-days: 30

      # A release asset can be downloaded with the repository's token; an artifact cannot, and
      # neither can the log of a run. So the APK goes there, and with it what the compiler and the
      # tests had to say, whether or not the build got as far as an APK.
      - name: Publish the APK and the build report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "commit $GITHUB_SHA"
            echo "tests: ${{ steps.tests.outcome }}, build: ${{ steps.build.outcome }}"
            echo
            echo "--- errors, warnings and failed tests ---"
            cat tests.log build.log 2>/dev/null |
              grep -E "^(e|w): |FAILED|^> Task .* FAILED|What went wrong|error:|Error:|tests completed" |
              sort -u | head -n 300
            echo
            echo "--- the end of the tests ---"
            tail -n 60 tests.log 2>/dev/null
            echo
            echo "--- the end of the build ---"
            tail -n 120 build.log 2>/dev/null
          } > build-report.txt || true
          notes="The latest build of the metadator-dex branch ($GITHUB_SHA)."
          if gh release view metadator-dex-apk >/dev/null 2>&1; then
            gh release edit metadator-dex-apk --title "Metadator DeX" --notes "$notes"
          else
            gh release create metadator-dex-apk --prerelease --target "$GITHUB_SHA" \
              --title "Metadator DeX" --notes "$notes"
          fi
          gh release upload metadator-dex-apk build-report.txt --clobber
          if [ -f metadator-dex.apk ]; then
            gh release upload metadator-dex-apk metadator-dex.apk --clobber
          fi

  # Nothing above has run the app. This does: on an emulator as wide as a monitor, with a keyboard
  # and a mouse, through adb, so that what is tried is the very APK that was published. It is a
  # report, not a gate: the APK is out already, and the online sources the cover finder asks are
  # not this build's to answer for.
  smoke:
    name: Use it on an emulator
    needs: apk
    if: ${{ !cancelled() && (needs.apk.result == 'success' || needs.apk.result == 'skipped') }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take the APK that was published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download metadator-dex-apk --pattern metadator-dex.apk --dir .

      - name: Make the songs to try it on
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          bash .github/smoke/make_audio.sh smoke-songs

      # The runner's processor can run the emulator's as its own, once its user is allowed to.
      - name: Let the emulator use the processor's virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the emulator
        id: emulator
        run: |
          set -o pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          bash .github/smoke/start_emulator.sh 2>&1 | tee emulator-start.log

      - name: Use the app
        id: use
        run: |
          set -o pipefail
          python3 .github/smoke/smoke.py metadator-dex.apk smoke-songs smoke-out 2>&1 | tee smoke.log

      # As with the build, the log of a run cannot be downloaded: what happened goes to the
      # release, as a report to read and the pictures taken along the way.
      - name: Publish what happened
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p smoke-out
          cp emulator-start.log emulator.log smoke.log smoke-out/ 2>/dev/null || true
          {
            echo "commit $GITHUB_SHA"
            echo "emulator: ${{ steps.emulator.outcome }}, the app: ${{ steps.use.outcome }}"
            echo
            cat smoke-out/report.txt 2>/dev/null || tail -n 80 emulator-start.log 2>/dev/null
          } > smoke-report.txt || true
          (cd smoke-out && zip -q -r ../smoke.zip . -x 'pulled/*')
          gh release upload metadator-dex-apk smoke-report.txt smoke.zip --clobber

