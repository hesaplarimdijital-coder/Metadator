name: Metadator DeX APK

# Builds the debug APK of the metadator-dex branch on every push and publishes it as a release
# asset, so it can be downloaded straight to a phone. This branch lives in a repository that is not
# a fork of Metadator; the upstream CI workflow only runs on master, v2 and pull requests, so it
# never fires here.
on:
  push:
    branches: [metadator-dex]
  workflow_dispatch:

permissions:
  contents: write

# A new push replaces the build still running: only the latest APK matters.
concurrency:
  group: metadator-dex-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: 'false'

      # Every build is signed with the same debug key, so a new APK installs over the previous one.
      - name: Use the branch's debug key
        run: |
          mkdir -p "$HOME/.android"
          cp .github/metadator-dex-debug.keystore "$HOME/.android/debug.keystore"

      - name: Unit tests of the plain Kotlin modules
        run: >
          ./gradlew
          :core:common:test :core:domain:test :tags:api:test
          :lookup:api:test :lookup:musicbrainz:test :lookup:deezer:test
          :lyrics:api:test :lyrics:lrclib:test
          --continue

      # Even when a test failed: a compile error elsewhere should show up in the same run.
      - name: Build the debug APK
        id: build
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleFossDebug --continue

      - name: Upload the APK
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadator-dex-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish the APK as a release asset
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/foss/debug/*.apk | head -n 1)
          cp "$apk" metadator-dex.apk
          gh release view metadator-dex-apk >/dev/null 2>&1 ||
            gh release create metadator-dex-apk --prerelease --target "$GITHUB_SHA" \
              --title "Metadator DeX (debug build)" \
              --notes "The latest debug build of the metadator-dex branch."
          gh release upload metadator-dex-apk metadator-dex.apk --clobber
