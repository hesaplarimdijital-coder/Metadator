name: Metamatik APK

# Builds Metamatik's APK on every push and publishes it as a release asset, so it can be downloaded
# straight to a phone. It runs where Metamatik is kept: the master branch of the Metadator fork it
# lives in, and the metadator-one branch of a repository that is not a fork, where it was built and
# where the upstream CI workflow, which runs only on master, v2 and pull requests, never fires.
#
# The APK is then used on an emulator (see .github/smoke), and what happened there is published
# next to it. A push that only changes how the APK is tried says so in its message, with
# [smoke-only], and the APK already published is tried again without being built again.
on:
  push:
    branches: [master, metadator-one]
  workflow_dispatch:

permissions:
  contents: write

# A new push replaces the build still running: only the latest APK matters.
concurrency:
  group: metamatik-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK
    if: ${{ !contains(github.event.head_commit.message, '[smoke-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: 'false'

      # Each step keeps what Gradle said, for the report below.
      - name: Unit tests of the plain Kotlin modules
        id: tests
        run: |
          set -o pipefail
          ./gradlew \
            :core:common:test :core:domain:test :tags:api:test \
            :lookup:api:test :lookup:musicbrainz:test :lookup:deezer:test :lookup:itunes:test \
            :lyrics:api:test :lyrics:lrclib:test \
            --continue 2>&1 | tee tests.log

      # A release build, as the app is meant to run: a debug one is slower, and brings LeakCanary
      # along. Signed with the key kept in this branch, so that each build installs over the one
      # before it, and under an id of its own (-Pmetadator.fork), so that it installs next to the
      # app from its store.
      - name: Build the APK
        id: build
        if: ${{ !cancelled() }}
        env:
          SIGNING_KEY_STORE_PATH: ${{ github.workspace }}/.github/metadator-dex-debug.keystore
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
          SIGNING_KEY_PASSWORD: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleFossRelease -Pmetadator.fork=one 2>&1 | tee build.log

      - name: Check that the APK is signed
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          apk=$(ls app/build/outputs/apk/foss/release/*.apk | head -n 1)
          case "$apk" in
            *-unsigned.apk) echo "::error::Unsigned APK: $apk"; exit 1 ;;
          esac
          cp "$apk" metamatik.apk
          ls -l metamatik.apk

      - name: Upload the APK
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metamatik
          path: metamatik.apk
          if-no-files-found: error
          retention-days: 30

      # A release asset can be downloaded with the repository's token; an artifact cannot, and
      # neither can the log of a run. So the APK goes there, and with it what the compiler and the
      # tests had to say, whether or not the build got as far as an APK.
      - name: Publish the APK and the build report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "commit $GITHUB_SHA"
            echo "tests: ${{ steps.tests.outcome }}, build: ${{ steps.build.outcome }}"
            echo
            echo "--- errors, warnings and failed tests ---"
            cat tests.log build.log 2>/dev/null |
              grep -E "^(e|w): |FAILED|^> Task .* FAILED|What went wrong|error:|Error:|tests completed" |
              sort -u | head -n 300
            echo
            echo "--- the end of the tests ---"
            tail -n 60 tests.log 2>/dev/null
            echo
            echo "--- the end of the build ---"
            tail -n 120 build.log 2>/dev/null
          } > build-report.txt || true
          notes="The latest build of Metamatik, from $GITHUB_REF_NAME ($GITHUB_SHA)."
          if gh release view metamatik-apk >/dev/null 2>&1; then
            gh release edit metamatik-apk --title "Metamatik" --notes "$notes"
          else
            gh release create metamatik-apk --prerelease --target "$GITHUB_SHA" \
              --title "Metamatik" --notes "$notes"
          fi
          gh release upload metamatik-apk build-report.txt --clobber
          if [ -f metamatik.apk ]; then
            # The APK this one replaces stays beside it, as what a phone has before it updates: the
            # emulator installs this one over it. Not when both are of this commit (a run started
            # again), which would update a build to itself.
            mkdir -p replaced
            gh release download metamatik-apk --pattern apk-commit.txt --dir replaced || true
            if [ "$(cat replaced/apk-commit.txt 2>/dev/null)" != "$GITHUB_SHA" ] &&
              gh release download metamatik-apk --pattern metamatik.apk --dir replaced; then
              mv replaced/metamatik.apk metamatik-previous.apk
              gh release upload metamatik-apk metamatik-previous.apk --clobber
            fi
            echo "$GITHUB_SHA" > apk-commit.txt
            gh release upload metamatik-apk metamatik.apk apk-commit.txt --clobber
          fi

  # Where Metamatik was built, ci.yml does not run (it runs on master, v2 and pull requests): this
  # does there what it does besides the unit tests and a build, so that master in the fork, where
  # it does run, keeps passing. What each check said is published as checks-report.txt. After the
  # APK, which makes the release this goes to.
  checks:
    name: Format, lint and the debug builds
    needs: apk
    if: ${{ !cancelled() && github.ref_name == 'metadator-one' && needs.apk.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build

      - name: Format
        id: format
        run: |
          set -o pipefail
          ./gradlew spotlessCheck 2>&1 | tee format.log

      - name: Lint
        id: lint
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ./gradlew lint --continue 2>&1 | tee lint.log

      - name: Debug builds of both flavors
        id: debug
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleFossDebug :app:assemblePlaystoreDebug 2>&1 | tee debug.log

      - name: Publish what they said
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "commit $GITHUB_SHA"
            echo "format: ${{ steps.format.outcome }}, lint: ${{ steps.lint.outcome }}," \
              "debug builds: ${{ steps.debug.outcome }}"
            echo
            echo "--- what the formatter would change ---"
            grep -E "violations|\.kts?\b" format.log 2>/dev/null | head -n 60
            echo
            echo "--- what lint found, the errors first ---"
            python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ElementTree

          order = {"Fatal": 0, "Error": 1, "Warning": 2}
          issues = set()
          for path in glob.glob("**/build/reports/lint-results-*.xml", recursive=True):
              for issue in ElementTree.parse(path).getroot().iter("issue"):
                  location = issue.find("location")
                  where = "?"
                  if location is not None:
                      where = f"{location.get('file')}:{location.get('line', '?')}"
                  issues.add((issue.get("severity"), issue.get("id"), where, issue.get("message")))
          for severity, name, where, message in sorted(
              issues, key=lambda issue: (order.get(issue[0], 3), issue[1], issue[2])
          )[:400]:
              print(f"{severity} [{name}] {where}: {message}")
          PY
            grep -E "Lint found|What went wrong|^> " lint.log 2>/dev/null | sort -u | head -n 40
            echo
            echo "--- the debug builds ---"
            grep -E "^(e|w): |FAILED|What went wrong" debug.log 2>/dev/null | sort -u | head -n 100
            tail -n 30 debug.log 2>/dev/null
          } > checks-report.txt || true
          gh release upload metamatik-apk checks-report.txt --clobber

  # Nothing above has run the app. This does: on an emulator as wide as a monitor, with a keyboard
  # and a mouse, through adb, so that what is tried is the very APK that was published. It is a
  # report, not a gate: the APK is out already, and the online sources the cover finder asks are
  # not this build's to answer for.
  smoke:
    name: Use it on an emulator
    needs: apk
    if: ${{ !cancelled() && (needs.apk.result == 'success' || needs.apk.result == 'skipped') }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    # The emulator takes up to ten minutes to start, the steps about twenty-five, and a slow
    # machine twice that.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take the APK that was published, and the one it replaced
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download metamatik-apk --pattern metamatik.apk --dir .
          gh release download metamatik-apk --pattern metamatik-previous.apk --dir . ||
            echo "No APK before this one: the update is not tried"

      - name: Make the songs to try it on
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          bash .github/smoke/make_audio.sh smoke-songs

      # The runner's processor can run the emulator's as its own, once its user is allowed to.
      - name: Let the emulator use the processor's virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the emulator
        id: emulator
        run: |
          set -o pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # Android 17, as the app targets: the image with 4 KB pages if there is one, else the
          # one with 16 KB pages, which the app's native library is aligned for.
          bash .github/smoke/start_emulator.sh \
            "system-images;android-37.0;google_apis;x86_64" \
            "system-images;android-37;google_apis;x86_64" \
            "system-images;android-37.0;google_apis_ps16k;x86_64" \
            "system-images;android-37;google_apis_ps16k;x86_64" \
            2>&1 | tee emulator-start.log

      - name: Use the app
        id: use
        run: |
          set -o pipefail
          previous=""
          if [ -f metamatik-previous.apk ]; then previous=metamatik-previous.apk; fi
          python3 .github/smoke/smoke.py metamatik.apk smoke-songs smoke-out $previous 2>&1 |
            tee smoke.log

      # As with the build, the log of a run cannot be downloaded: what happened goes to the
      # release, as a report to read and the pictures taken along the way.
      - name: Publish what happened
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p smoke-out
          cp emulator-start.log emulator.log smoke.log smoke-out/ 2>/dev/null || true
          {
            echo "commit $GITHUB_SHA"
            echo "emulator: ${{ steps.emulator.outcome }}, the app: ${{ steps.use.outcome }}"
            echo
            cat smoke-out/report.txt 2>/dev/null || tail -n 80 emulator-start.log 2>/dev/null
          } > smoke-report.txt || true
          (cd smoke-out && zip -q -r ../smoke.zip . -x 'pulled/*')
          gh release upload metamatik-apk smoke-report.txt smoke.zip --clobber


  # Only when a push asks for it, with "[perf-ab <run id>]" in its message: this build and the APK
  # of that earlier run timed on one emulator, one after the other, twice each. The machines the
  # runs get differ in speed more than one build from the next, so two builds are only compared on
  # one machine. The earlier APK is taken from its run's artifact, which lasts thirty days.
  perf:
    name: Time it against an earlier build
    needs: apk
    if: ${{ !cancelled() && needs.apk.result == 'success' && contains(github.event.head_commit.message, '[perf-ab ') }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take this APK and the earlier one
        id: apks
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          gh release download metamatik-apk --pattern metamatik.apk --dir .
          earlier=$(printf '%s' "$MESSAGE" | grep -oE '\[perf-ab [0-9]+\]' | grep -oE '[0-9]+' | head -n 1)
          gh run download "$earlier" --name metamatik --dir earlier
          echo "run=$earlier" >> "$GITHUB_OUTPUT"
          ls -l metamatik.apk earlier/

      - name: Make the songs to time it with
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          bash .github/smoke/make_audio.sh smoke-songs

      - name: Let the emulator use the processor's virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the emulator
        run: |
          set -o pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          bash .github/smoke/start_emulator.sh \
            "system-images;android-37.0;google_apis;x86_64" \
            "system-images;android-37;google_apis;x86_64" \
            "system-images;android-37.0;google_apis_ps16k;x86_64" \
            "system-images;android-37;google_apis_ps16k;x86_64" \
            2>&1 | tee emulator-start.log

      # Earlier, this, earlier, this: what the machine does over the half hour weighs on both.
      - name: Time both, twice each
        run: |
          for round in 1 2; do
            for build in earlier this; do
              apk=metamatik.apk
              if [ "$build" = earlier ]; then apk=earlier/metamatik.apk; fi
              SMOKE_TIMED_ALONE=1 python3 .github/smoke/smoke.py "$apk" smoke-songs \
                "perf-out/$round-$build" 2>&1 | tee -a perf.log || true
            done
          done

      - name: Publish the times
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "commit $GITHUB_SHA, timed against the APK of run ${{ steps.apks.outputs.run }}"
            for report in perf-out/*/report.txt; do
              echo
              echo "--- $(basename "$(dirname "$report")")"
              grep -A 1 "How fast it is" "$report" || tail -n 20 "$report"
            done
          } > perf-report.txt || true
          cat perf-report.txt
          gh release upload metamatik-apk perf-report.txt --clobber
