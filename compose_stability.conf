// Types from plain Kotlin modules are immutable by contract: Compose cannot infer it across
// module boundaries, so it is declared here.
com.bobbyesp.metadator.core.model.*
com.bobbyesp.metadator.tags.api.*
com.bobbyesp.metadator.library.api.*
com.bobbyesp.metadator.lookup.api.*
com.bobbyesp.metadator.lyrics.api.*
com.bobbyesp.metadator.player.api.*
// What the domain hands the screens (a song's quality, a draft of its tags, a cover found) is
// immutable data as well. Unknown, a quality made again equal to the last was taken for a change,
// and every row of the library drew itself again each time a song was checked.
com.bobbyesp.metadator.core.domain.**
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
